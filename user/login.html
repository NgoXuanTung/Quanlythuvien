<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập — Nhã Nam Books</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="auth-page">
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">📚</div>
      <div class="logo-name">Nhã Nam Books</div>
    </div>
    <h1 class="auth-title">Chào mừng trở lại!</h1>
    <p class="auth-subtitle">Đăng nhập để trải nghiệm mua sắm tốt hơn</p>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label><i class="fas fa-envelope" style="color:var(--amber);margin-right:6px"></i>Email</label>
        <input type="email" id="loginEmail" required placeholder="email@gmail.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label><i class="fas fa-lock" style="color:var(--amber);margin-right:6px"></i>Mật khẩu</label>
        <div style="position:relative">
          <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password" style="padding-right:44px" />
          <button type="button" onclick="togglePass('loginPassword',this)"
            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--gray-400);font-size:0.9rem">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <p class="error-text" id="loginError"></p>
      <button type="submit" class="btn-auth" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> Đăng nhập
      </button>
    </form>

    <!-- Tài khoản demo -->
    <div style="background:var(--gray-100);border-radius:8px;padding:12px;margin-top:16px;font-size:.8rem;color:var(--gray-600)">
      <strong>🔑 Tài khoản demo:</strong><br/>
      Admin: admin@nhanam.vn / admin123<br/>
      User: an@gmail.com / 123456
    </div>

    <div class="auth-footer">
      Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
    </div>
    <div class="auth-footer" style="margin-top:6px">
      <a href="index.html">← Về trang chủ</a>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
function togglePass(id, btn) {
  const input = document.getElementById(id);
  if (input.type === 'password') {
    input.type = 'text';
    btn.innerHTML = '<i class="fas fa-eye-slash"></i>';
  } else {
    input.type = 'password';
    btn.innerHTML = '<i class="fas fa-eye"></i>';
  }
}
// Redirect nếu đã đăng nhập
if (Auth.isLoggedIn()) window.location.href = 'index.html';
</script>
</body>
</html>
