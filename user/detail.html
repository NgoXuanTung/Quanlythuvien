<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết sách — Nhã Nam Books</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
<header class="site-header">
  <div class="header-main-row">
    <div class="container">
      <a href="index.html" class="logo">
        <span class="logo-icon">📚</span>
        <div><div class="logo-name">Nhã Nam</div><div class="logo-sub">Books</div></div>
      </a>
      <div class="search-box" style="flex:1">
        <input type="text" placeholder="Tìm sách..." id="searchInput"
          onkeypress="if(event.key==='Enter')window.location='index.html?q='+this.value" />
        <button onclick="window.location='index.html?q='+document.getElementById('searchInput').value">
          <i class="fas fa-search"></i>
        </button>
      </div>
      <div class="header-right">
        <a href="cart.html" class="cart-btn">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-count" id="cartBadge">0</span>
        </a>
        <div id="authLinks"></div>
      </div>
    </div>
  </div>
</header>

<main style="padding-bottom:80px">
  <div class="container">
    <div id="detailContainer">
      <div style="text-align:center;padding:80px;color:#a89880">
        <i class="fas fa-spinner fa-spin" style="font-size:2rem"></i>
        <p style="margin-top:12px">Đang tải...</p>
      </div>
    </div>
    <div id="relatedBooks" style="padding-bottom:40px"></div>
  </div>
</main>

<div class="toast" id="toast"></div>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/detail.js"></script>
</body>
</html>
