<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch Sử Đơn Hàng — Nhã Nam Books</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
<header class="site-header">
  <div class="header-main-row">
    <div class="container">
      <a href="index.html" class="logo">
        <span class="logo-icon">📚</span>
        <div><div class="logo-name">Nhã Nam</div><div class="logo-sub">Books</div></div>
      </a>
      <div class="header-right" style="margin-left:auto">
        <a href="cart.html" class="cart-btn"><i class="fas fa-shopping-cart"></i><span class="cart-count" id="cartBadge">0</span></a>
        <div id="authLinks"></div>
      </div>
    </div>
  </div>
</header>

<div class="page-hero">
  <div class="container">
    <h1><i class="fas fa-receipt" style="color:var(--amber);margin-right:12px"></i>Lịch Sử Đơn Hàng</h1>
    <p>Theo dõi tất cả đơn hàng của bạn</p>
  </div>
</div>

<main style="padding: 40px 0 80px">
  <div class="container" style="max-width:800px">

    <!-- Status Guide -->
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px">
      <span class="status-badge status-pending">Chờ xác nhận</span>
      <span class="status-badge status-processing">Đang xử lý</span>
      <span class="status-badge status-shipping">Đang giao</span>
      <span class="status-badge status-done">Hoàn thành</span>
      <span class="status-badge status-cancelled">Đã huỷ</span>
    </div>

    <div id="ordersContainer">
      <div class="loading-state"><i class="fas fa-spinner fa-spin"></i> Đang tải đơn hàng...</div>
    </div>

    <div style="text-align:center;margin-top:32px">
      <a href="index.html" class="btn-primary" style="display:inline-flex">
        <i class="fas fa-book-open"></i> Tiếp tục mua sắm
      </a>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/checkout.js"></script>
<script>window.addEventListener('DOMContentLoaded', initOrders);</script>
</body>
</html>
